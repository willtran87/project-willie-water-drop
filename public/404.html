<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Willie Water Drop</title>
    <script>
      // SPA redirect for GitHub Pages — preserves the path for React Router
      var path = window.location.pathname.replace('/project-willie-water-drop', '');
      var query = window.location.search;
      window.location.replace(
        window.location.origin + '/project-willie-water-drop/' +
        '?p=' + encodeURIComponent(path + query)
      );
    </script>
  </head>
  <body></body>
</html>
